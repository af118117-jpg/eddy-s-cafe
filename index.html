<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the safe-area insets the mobile action bar pads for. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFDFC" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The build preloads the hero photo here, first (vite.config.ts, pageHtml). -->
    <!-- hero-preload -->
    <!-- Must match the @font-face URL in src/styles/base.css. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-400-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="description" content="eddy's Café, 77 Green Avenue West, Canal Road, Faisalabad." />
    <title>eddy's Café</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
